<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語クイズ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://unpkg.com/dexie@4.2.1/dist/dexie.min.js"></script><style>.bucket-list{max-height:280px;overflow-y:auto}.bucket-option{cursor:pointer;height:100%}.bucket-option .card{transition:.15s;border:1px solid #dee2e6}.bucket-option input:checked+.card{border:2px solid #0d6efd;background:#eef5ff}.bucket-option .card:hover{border-color:#86b7fe}.bucket-option input{position:absolute;opacity:0;pointer-events:none}</style></head><body class="bg-light"><main class="container py-5" style="max-width:650px">
<section id="home" class="text-center py-5"><h1 class="mb-4">英単語クイズ</h1><p class="text-secondary mb-4">英単語の意味を4択から選ぼう！</p><div class="d-grid gap-2 col-8 mx-auto"><button class="btn btn-primary btn-lg" onclick="showConfirm()">開始</button><button class="btn btn-outline-secondary" onclick="showManage()">バケット管理</button></div></section>
<section id="confirm" class="d-none"><h2 class="text-center mb-4">出題内容の確認</h2><div class="card mb-4"><div class="card-body"><h5 class="mb-3">出題設定</h5><div class="mb-3"><label class="form-label">出題バケット</label><div id="gameBuckets" class="row row-cols-2 g-2 bucket-list"></div></div><div class="row g-3 mb-3"><div class="col-6"><label class="form-label">全体時間（秒）</label><input id="totalSeconds" type="number" class="form-control" min="10" max="3600" value="60"></div><div class="col-6"><label class="form-label">1問の制限時間（秒）</label><input id="questionSeconds" type="number" class="form-control" min="1" max="120" value="5"></div><div class="col-6"><label class="form-label">出題対象単語数</label><input id="wordAmount" type="number" class="form-control" min="4" max="999" value="10" oninput="updateConfirm()"></div><div class="col-6"><label class="form-label">選択肢</label><input class="form-control" value="4択" disabled></div></div><div class="form-check mb-4"><input id="autoSpeak" type="checkbox" class="form-check-input"><label class="form-check-label" for="autoSpeak">問題表示時に自動で読み上げる</label></div><div id="configMessage" class="small text-danger mb-3"></div><hr><div class="d-flex justify-content-between mb-3"><strong>今回の出題単語</strong><span class="text-secondary small" id="wordCount"></span></div><div class="table-responsive"><table class="table table-bordered table-striped text-center align-middle mb-0 bg-white"><thead class="table-light"><tr><th style="width:50px">No.</th><th>英単語</th><th>日本語</th></tr></thead><tbody id="selectedList"></tbody></table></div></div></div><div class="d-flex gap-2"><button class="btn btn-outline-secondary flex-fill" onclick="show('home')">戻る</button><button class="btn btn-outline-primary flex-fill" onclick="showManage()">単語管理</button><button class="btn btn-primary flex-fill" onclick="startGame()">スタート</button></div></section>
<section id="manage" class="d-none"><h2 class="text-center mb-4">バケット管理</h2><div class="card mb-3"><div class="card-body"><h5>バケット選択</h5><select id="manageBucket" class="form-select mb-3" onchange="changeManageBucket()"></select><div class="input-group mb-3"><input id="newBucketName" class="form-control" placeholder="新しいバケット名"><button class="btn btn-outline-primary" onclick="addBucket()">作成</button></div><button class="btn btn-outline-danger btn-sm w-100" onclick="deleteBucket()">選択中のバケットを削除</button></div></div><div class="card mb-3"><div class="card-body"><h5>単語追加</h5><div class="mb-2"><label class="form-label">英単語</label><input id="newEnglish" class="form-control" placeholder="apple"></div><div class="mb-3"><label class="form-label">日本語</label><input id="newJapanese" class="form-control" placeholder="りんご"></div><button class="btn btn-primary w-100" onclick="addWord()">単語を追加</button><p id="addMessage" class="small mt-2 mb-0"></p></div></div><div class="card mb-3"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">登録単語</h5><span class="badge bg-secondary" id="manageCount">0語</span></div><div class="table-responsive"><table class="table table-bordered table-striped text-center align-middle bg-white mb-0"><thead class="table-light"><tr><th>英単語</th><th>日本語</th><th style="width:65px">削除</th></tr></thead><tbody id="manageWords"></tbody></table></div></div></div><div class="card mb-3"><div class="card-body"><h5>CSV読み込み</h5><p class="small text-secondary">選択中のバケットの単語を丸ごと置き換えます。</p><textarea id="inputCsv" class="form-control mb-3" rows="6" placeholder="en,ja&#10;apple,りんご&#10;book,本"></textarea><button class="btn btn-primary w-100" onclick="importWords()">CSVを読み込む</button><p id="importMessage" class="small mt-2 mb-0"></p></div></div><div class="card mb-3"><div class="card-body"><h5>CSV出力</h5><textarea id="outputCsv" class="form-control mb-2" rows="6" readonly></textarea><button class="btn btn-outline-primary w-100" onclick="exportWords()">CSVを出力</button></div></div><button class="btn btn-outline-secondary w-100" onclick="show('home')">戻る</button></section>
<section id="game" class="d-none"><div class="d-flex justify-content-between mb-3"><span id="progress" class="fw-bold">出題数：1問</span><span>正解数：<strong id="score">0</strong></span></div><div class="progress mb-3" style="height:10px"><div id="totalBar" class="progress-bar bg-success" style="width:100%"></div></div><div class="d-flex justify-content-between mb-2"><span class="text-secondary small">セット残り時間</span><strong id="totalTime">60秒</strong></div><div class="progress mb-4" style="height:6px"><div id="questionBar" class="progress-bar bg-primary" style="width:100%"></div></div><div class="card shadow-sm"><div class="card-body text-center py-4"><p class="text-secondary mb-2">次の英単語の意味は？</p><div class="d-flex justify-content-center align-items-center gap-2 mb-4"><h2 id="question" class="display-5 fw-bold mb-0"></h2><button class="btn btn-outline-secondary btn-sm" onclick="speakCurrent()" title="読み上げ" aria-label="英単語を読み上げる"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button></div><div id="choices" class="row row-cols-2 g-3"></div><p id="feedback" class="mt-3 mb-0 text-secondary small">正しい答えを選んでください</p><div class="mt-4 p-3 bg-light rounded"><div class="text-secondary small">次の問題</div><strong id="nextWord">---</strong></div></div></div></section>
<section id="result" class="d-none py-4"><h2 class="text-center mb-4">ゲーム終了！</h2><div class="card text-center mb-4"><div class="card-body py-4"><p class="text-secondary mb-2">正解数 / 出題数</p><div class="display-2 fw-bold text-primary" id="finalScore">0 / 0</div><p id="resultMessage" class="text-secondary mb-0 mt-2"></p></div></div><h5 class="mb-3">出題対象単語の成績</h5><div class="table-responsive"><table class="table table-bordered table-striped text-center align-middle bg-white"><thead class="table-light"><tr><th>英単語</th><th>日本語</th><th>正解数 / 出題数</th></tr></thead><tbody id="wordResults"></tbody></table></div><button class="btn btn-primary btn-lg w-100 mt-3" onclick="showConfirm()">もう一度遊ぶ</button></section>
</main>
<script>
const db=new Dexie("EnglishQuizDB");db.version(1).stores({buckets:"id,name",meta:"key"});
const initialBuckets=[{name:"中学単語",words:[["apple","りんご"],["book","本"],["school","学校"],["friend","友達"],["family","家族"],["water","水"],["house","家"],["beautiful","美しい"],["important","重要な"],["question","質問"],["answer","答え"],["morning","朝"],["country","国"],["music","音楽"],["because","なぜなら"],["usually","たいてい"],["sometimes","ときどき"],["different","異なる"],["interesting","面白い"],["remember","覚えている"]]},{name:"高校単語",words:[["achieve","達成する"],["environment","環境"],["opportunity","機会"],["increase","増加する"],["reduce","減らす"],["society","社会"],["experience","経験"],["available","利用できる"],["consider","検討する"],["purpose","目的"],["necessary","必要な"],["relationship","関係"],["knowledge","知識"],["develop","発展させる"],["situation","状況"],["effective","効果的な"],["provide","提供する"],["decision","決定"],["particular","特定の"],["suggest","提案する"]]},{name:"動詞",words:[["accept","受け入れる"],["achieve","達成する"],["allow","許可する"],["appear","現れる"],["believe","信じる"],["choose","選ぶ"],["create","創造する"],["decide","決める"],["explain","説明する"],["improve","改善する"],["include","含む"],["increase","増やす"],["manage","管理する"],["notice","気づく"],["prepare","準備する"],["protect","守る"],["receive","受け取る"],["remember","覚えている"],["suggest","提案する"],["support","支援する"]]},{name:"名詞",words:[["ability","能力"],["advice","助言"],["chance","機会"],["choice","選択"],["culture","文化"],["effort","努力"],["example","例"],["future","未来"],["goal","目標"],["habit","習慣"],["idea","考え"],["knowledge","知識"],["language","言語"],["memory","記憶"],["opinion","意見"],["problem","問題"],["reason","理由"],["result","結果"],["success","成功"],["value","価値"]]},{name:"カスタム",words:[["focus","集中する"],["challenge","挑戦"],["discover","発見する"],["freedom","自由"],["journey","旅"],["opportunity","好機"],["progress","進歩"],["realize","気づく"],["skill","技能"],["target","目標"]]}];
let buckets=[],activeBucketId=null,selectedWords=[],currentWord=null,nextWord=null,wordBag=[],wordBagIndex=0,settings={totalSeconds:60,questionSeconds:5,wordAmount:10,autoSpeak:false},index=0,score=0,questionEnd=0,totalEnd=0,timer=null,advanceTimer=null,locked=false,active=false,stats={},speechTimer=null,speechToken=0;
const $=id=>document.getElementById(id);
function show(id){["home","confirm","manage","game","result"].forEach(x=>$(x).classList.toggle("d-none",x!==id))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawWord(){if(wordBagIndex>=wordBag.length){const previous=wordBag.length?wordBag[wordBag.length-1]:null;wordBag=shuffle(selectedWords);wordBagIndex=0;if(wordBag.length>1&&wordBag[0]===previous)[wordBag[0],wordBag[1]]=[wordBag[1],wordBag[0]]}return wordBag[wordBagIndex++]}
async function saveData(){await db.transaction("rw",db.buckets,db.meta,async()=>{await db.buckets.clear();if(buckets.length)await db.buckets.bulkPut(buckets);await db.meta.put({key:"activeBucketId",value:activeBucketId})})}
async function saveSettings(){await db.meta.put({key:"settings",value:settings})}
async function init(){const seed=await db.meta.get("bucketSeedVersion");if(seed?.value!==2){buckets=initialBuckets.map((b,i)=>({id:Date.now()+i,name:b.name,words:b.words.map(([en,ja])=>({en,ja}))}));activeBucketId=buckets[0].id;await db.buckets.clear();await db.buckets.bulkPut(buckets);await db.meta.put({key:"bucketSeedVersion",value:2});await db.meta.put({key:"activeBucketId",value:activeBucketId})}else{buckets=await db.buckets.toArray();if(!buckets.length){buckets=initialBuckets.map((b,i)=>({id:Date.now()+i,name:b.name,words:b.words.map(([en,ja])=>({en,ja}))}));activeBucketId=buckets[0].id;await saveData()}else{const saved=await db.meta.get("activeBucketId");activeBucketId=saved?.value;if(!buckets.some(b=>b.id==activeBucketId)){activeBucketId=buckets[0].id;await saveData()}}}const savedSettings=await db.meta.get("settings");if(savedSettings?.value)settings={...settings,...savedSettings.value};show("home")}
function getBucket(id){return buckets.find(b=>b.id==id)}function getActiveBucket(){return getBucket(activeBucketId)}
function parseCSV(s){let rows=[],row=[],cell="",quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===","){row.push(cell.trim());cell=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;row.push(cell.trim());if(row.some(x=>x))rows.push(row);row=[];cell=""}else cell+=c}if(quoted)throw Error("CSVの引用符が正しく閉じられていません");row.push(cell.trim());if(row.some(x=>x))rows.push(row);return rows}
function toCSV(list){return "en,ja\n"+list.map(w=>[w.en,w.ja].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n")}
function validateCSV(s){let rows=parseCSV(s.replace(/^\uFEFF/,""));if(rows[0]&&rows[0][0].toLowerCase()==="en"&&rows[0][1].toLowerCase()==="ja")rows.shift();if(!rows.length)throw Error("単語が登録されていません");let result=[],seen=new Set();for(let i=0;i<rows.length;i++){let r=rows[i];if(r.length!==2||!r[0]||!r[1])throw Error((i+1)+"行目の形式が正しくありません");let key=r[0].toLowerCase();if(seen.has(key))throw Error("英単語「"+r[0]+"」が重複しています");seen.add(key);result.push({en:r[0],ja:r[1]})}return result}
function refreshBucketSelect(selectId){const select=$(selectId);select.replaceChildren();buckets.forEach(b=>{const option=document.createElement("option");option.value=b.id;option.textContent=b.name;option.selected=b.id==activeBucketId;select.append(option)})}
function renderGameBuckets(){const list=$("gameBuckets");list.replaceChildren(...buckets.map(b=>{const col=document.createElement("div"),label=document.createElement("label"),input=document.createElement("input"),card=document.createElement("div"),body=document.createElement("div"),name=document.createElement("div"),count=document.createElement("small");col.className="col";label.className="bucket-option d-block position-relative";input.type="radio";input.name="gameBucket";input.value=b.id;input.checked=b.id==activeBucketId;card.className="card";body.className="card-body p-3";name.className="fw-bold";name.textContent=b.name;count.className="text-secondary";count.textContent=b.words.length+"語";input.addEventListener("change",()=>{if(input.checked){activeBucketId=b.id;saveData();updateConfirm()}});body.append(name,count);card.append(body);label.append(input,card);col.append(label);return col}))}
async function addBucket(){const name=$("newBucketName").value.trim();if(!name){alert("バケット名を入力してください");return}if(buckets.some(b=>b.name===name)){alert("同じ名前のバケットが存在します");return}const bucket={id:Date.now()+Math.random(),name,words:[]};buckets.push(bucket);activeBucketId=bucket.id;$("newBucketName").value="";await saveData();renderManage()}
async function deleteBucket(){if(buckets.length<=1){alert("最後のバケットは削除できません");return}const bucket=getActiveBucket();if(!confirm("「"+bucket.name+"」を削除しますか？\n登録単語もすべて削除されます。"))return;buckets=buckets.filter(b=>b.id!=activeBucketId);activeBucketId=buckets[0].id;await saveData();renderManage()}
async function changeManageBucket(){activeBucketId=$("manageBucket").value;await saveData();renderManage()}
async function addWord(){const en=$("newEnglish").value.trim(),ja=$("newJapanese").value.trim(),bucket=getActiveBucket();if(!en||!ja){showAddMessage("英単語と日本語を入力してください","danger");return}if(bucket.words.some(w=>w.en.toLowerCase()===en.toLowerCase())){showAddMessage("このバケットには既に登録されています","danger");return}bucket.words.push({en,ja});$("newEnglish").value="";$("newJapanese").value="";await saveData();renderManage();showAddMessage("単語を追加しました","success")}
async function deleteWord(index){const bucket=getActiveBucket();if(!confirm("この単語を削除しますか？"))return;bucket.words.splice(index,1);await saveData();renderManage()}
function showAddMessage(message,type){$("addMessage").textContent=message;$("addMessage").className="small mt-2 mb-0 text-"+type}
function renderManage(){refreshBucketSelect("manageBucket");const bucket=getActiveBucket();$("manageCount").textContent=bucket.words.length+"語";$("manageWords").replaceChildren(...bucket.words.map((w,i)=>{const tr=document.createElement("tr");[w.en,w.ja].forEach((v,j)=>{const td=document.createElement("td");td.textContent=v;if(j===0)td.className="fw-bold";tr.append(td)});const td=document.createElement("td"),btn=document.createElement("button");btn.className="btn btn-outline-danger btn-sm";btn.textContent="削除";btn.onclick=()=>deleteWord(i);td.append(btn);tr.append(td);return tr}))}
function showManage(){$("inputCsv").value="";$("outputCsv").value="";$("importMessage").textContent="";$("addMessage").textContent="";renderManage();show("manage")}
async function importWords(){try{const imported=validateCSV($("inputCsv").value),bucket=getActiveBucket();if(!confirm("現在のバケットの単語をすべて置き換えますか？"))return;bucket.words=imported;await saveData();renderManage();$("importMessage").textContent=imported.length+"語を保存しました";$("importMessage").className="small mt-2 mb-0 text-success";$("outputCsv").value=toCSV(imported)}catch(e){$("importMessage").textContent=e.message;$("importMessage").className="small mt-2 mb-0 text-danger"}}
function exportWords(){$("outputCsv").value=toCSV(getActiveBucket().words);$("outputCsv").focus();$("outputCsv").select()}
function readSettings(){const total=Number($("totalSeconds").value),question=Number($("questionSeconds").value),amount=Number($("wordAmount").value);if(!Number.isInteger(total)||total<10||total>3600)throw Error("全体時間は10～3600秒で指定してください");if(!Number.isInteger(question)||question<1||question>120)throw Error("1問の制限時間は1～120秒で指定してください");if(!Number.isInteger(amount)||amount<4)throw Error("出題対象単語数は4語以上にしてください");settings={totalSeconds:total,questionSeconds:question,wordAmount:amount,autoSpeak:$("autoSpeak").checked};saveSettings()}
function showConfirm(){renderGameBuckets();$("totalSeconds").value=settings.totalSeconds;$("questionSeconds").value=settings.questionSeconds;$("wordAmount").value=settings.wordAmount;$("autoSpeak").checked=settings.autoSpeak;$("configMessage").textContent="";updateConfirm();show("confirm")}
function updateConfirm(){const bucket=getActiveBucket();if(!bucket)return;$("wordCount").textContent=bucket.words.length+"語登録";let amount=Number($("wordAmount").value);if(!Number.isInteger(amount)||amount<1)amount=1;const preview=shuffle(bucket.words).slice(0,Math.min(amount,bucket.words.length));$("selectedList").replaceChildren(...preview.map((w,i)=>{const tr=document.createElement("tr");[i+1,w.en,w.ja].forEach((v,j)=>{const td=document.createElement("td");td.textContent=v;if(j===1)td.className="fw-bold";tr.append(td)});return tr}))}
function stopSpeech(){speechToken++;clearTimeout(speechTimer);speechTimer=null;if("speechSynthesis"in window)window.speechSynthesis.cancel()}
function speakCurrent(){if(!currentWord)return;if(!("speechSynthesis"in window)||!("SpeechSynthesisUtterance"in window)){$("feedback").textContent="このブラウザは音声読み上げに対応していません";return}const word=currentWord.en;stopSpeech();const token=speechToken;speechTimer=setTimeout(()=>{if(token!==speechToken||!active)return;const utterance=new SpeechSynthesisUtterance(word);utterance.lang="en-US";utterance.rate=0.9;utterance.pitch=1;utterance.volume=1;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==="en-us")||voices.find(v=>v.lang.toLowerCase().startsWith("en-"))||voices.find(v=>v.lang.toLowerCase().startsWith("en"));if(voice)utterance.voice=voice;utterance.onerror=event=>{if(token===speechToken&&event.error!=="canceled"&&event.error!=="interrupted")$("feedback").textContent="音声を再生できませんでした"};window.speechSynthesis.speak(utterance);speechTimer=null},100)}
function startGame(){try{readSettings()}catch(e){$("configMessage").textContent=e.message;return}const bucket=getActiveBucket();if(bucket.words.length<settings.wordAmount){$("configMessage").textContent="このバケットには単語が足りません。登録数："+bucket.words.length+"語";return}const available=shuffle(bucket.words),unique=[],translations=new Set();for(const word of available){if(!translations.has(word.ja)){unique.push(word);translations.add(word.ja)}}if(unique.length<settings.wordAmount){$("configMessage").textContent="日本語訳が異なる単語が不足しています。出題可能数："+unique.length+"語";return}selectedWords=unique.slice(0,settings.wordAmount);wordBag=[];wordBagIndex=0;clearInterval(timer);clearTimeout(advanceTimer);stopSpeech();index=0;score=0;stats=Object.fromEntries(selectedWords.map(w=>[w.en,{shown:0,correct:0}]));totalEnd=Date.now()+settings.totalSeconds*1000;active=true;nextWord=drawWord();$("score").textContent=score;show("game");nextQuestion();timer=setInterval(tick,100)}
function nextQuestion(){if(!active)return;if(Date.now()>=totalEnd){finish();return}clearTimeout(advanceTimer);stopSpeech();locked=false;questionEnd=Date.now()+settings.questionSeconds*1000;currentWord=nextWord||drawWord();nextWord=drawWord();$("nextWord").textContent=nextWord.en;const others=shuffle(selectedWords.filter(w=>w!==currentWord)),choices=shuffle([currentWord.ja,...others.slice(0,3).map(w=>w.ja)]);stats[currentWord.en].shown++;index++;$("progress").textContent="出題数："+index+"問";$("score").textContent=score;$("question").textContent=currentWord.en;$("feedback").textContent="正しい答えを選んでください";$("choices").replaceChildren(...choices.map(c=>{const col=document.createElement("div");col.className="col";const b=document.createElement("button");b.className="btn btn-outline-primary btn-lg w-100 h-100 py-4";b.textContent=c;b.addEventListener("click",()=>answer(b,currentWord));col.append(b);return col}));if(settings.autoSpeak)speakCurrent();tick()}
function answer(button,q){if(locked||!active)return;if(button.textContent===q.ja){locked=true;score++;stats[q.en].correct++;$("score").textContent=score;$("feedback").textContent="正解！";button.classList.replace("btn-outline-primary","btn-success");$("choices").querySelectorAll("button").forEach(b=>b.disabled=true);advanceTimer=setTimeout(()=>{if(!active)return;if(Date.now()>=totalEnd)finish();else nextQuestion()},500)}else{button.classList.replace("btn-outline-primary","btn-danger");button.disabled=true;$("feedback").textContent="不正解！もう一度選んでください"}}
function tick(){if(!active)return;const now=Date.now(),total=Math.max(0,totalEnd-now),question=Math.max(0,questionEnd-now);$("totalTime").textContent=(total/1000).toFixed(1)+"秒";$("totalBar").style.width=total/(settings.totalSeconds*10)+"%";$("questionBar").style.width=question/(settings.questionSeconds*10)+"%";if(total<=0){finish();return}if(question<=0&&!locked){locked=true;$("feedback").textContent="時間切れ！ 正解は「"+currentWord.ja+"」です（"+currentWord.en+"）";$("choices").querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.textContent===currentWord.ja){b.classList.remove("btn-outline-primary");b.classList.add("btn-success")}});advanceTimer=setTimeout(()=>{if(!active)return;if(Date.now()>=totalEnd)finish();else nextQuestion()},700)}}
function finish(){if(!active)return;active=false;clearInterval(timer);clearTimeout(advanceTimer);stopSpeech();$("finalScore").textContent=score+" / "+index;$("resultMessage").textContent="正答率："+(index?Math.round(score/index*100):0)+"%　お疲れさまでした！";$("wordResults").replaceChildren(...selectedWords.map(w=>{const tr=document.createElement("tr");[w.en,w.ja,stats[w.en].correct+" / "+stats[w.en].shown].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===0)td.className="fw-bold";tr.append(td)});return tr}));show("result")}
init().catch(e=>{console.error(e);alert("データベースの初期化に失敗しました。ページを再読み込みしてください。")});
</script></body></html>
